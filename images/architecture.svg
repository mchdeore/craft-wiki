<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">
  <title id="t">The parts of CRAFT</title>
  <desc id="d">The screens call the server. The server and the workers call the library, which is kept in PostgreSQL or in a folder. Workers give each job that needs a machine to a launcher, which makes one for that job alone. Workers, and the server for the words of a search, ask hosted models, which are optional.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
  </defs>
  <rect x="0" y="0" width="860" height="470" rx="8" fill="#ffffff"/>
  <g fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5">
    <rect x="30" y="30" width="250" height="60" rx="6"/>
    <rect x="30" y="150" width="250" height="60" rx="6"/>
    <rect x="30" y="270" width="370" height="60" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <rect x="30" y="390" width="230" height="60" rx="6"/>
    <rect x="290" y="390" width="110" height="60" rx="6" stroke-dasharray="5 4"/>
    <rect x="510" y="30" width="320" height="60" rx="6" stroke-dasharray="5 4"/>
    <rect x="510" y="150" width="320" height="60" rx="6"/>
    <rect x="510" y="270" width="320" height="60" rx="6"/>
    <rect x="510" y="390" width="320" height="60" rx="6" fill="#fff8c5" stroke="#9a6700"/>
  </g>
  <g fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)">
    <path d="M155 90V148"/>
    <path d="M155 210V268"/>
    <path d="M145 330V388"/>
    <path d="M345 330V388" stroke-dasharray="5 4"/>
    <path d="M510 180H460V300H402"/>
    <path d="M670 210V268"/>
    <path d="M670 330V388"/>
    <path d="M670 150V92" stroke-dasharray="5 4"/>
    <path d="M280 180H400V60H508" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle">
    <text x="155" y="56" font-weight="600">Screens</text>
    <text x="155" y="77" font-size="13">in the browser</text>
    <text x="155" y="176" font-weight="600">Server</text>
    <text x="155" y="197" font-size="13">who is asking; one address for each call</text>
    <text x="215" y="296" font-weight="600">Library</text>
    <text x="215" y="317" font-size="13">the eight calls and every rule</text>
    <text x="145" y="416" font-weight="600">PostgreSQL</text>
    <text x="145" y="437" font-size="13">objects, changes, jobs, bytes</text>
    <text x="345" y="416" font-weight="600">or a folder</text>
    <text x="345" y="437" font-size="13">no workers</text>
    <text x="670" y="56" font-weight="600">Hosted models</text>
    <text x="670" y="77" font-size="13">optional; a monthly cap</text>
    <text x="670" y="176" font-weight="600">Workers</text>
    <text x="670" y="197" font-size="13">take queued jobs, as the person who asked</text>
    <text x="670" y="296" font-weight="600">Launcher</text>
    <text x="670" y="317" font-size="13">on the host, only for jobs that need a machine</text>
    <text x="670" y="416" font-weight="600">Machine</text>
    <text x="670" y="437" font-size="13">one job, then destroyed</text>
  </g>
  <g font-size="13" fill="#57606a">
    <text x="167" y="124">calls, as JSON</text>
    <text x="682" y="124">if set up</text>
    <text x="408" y="124">words of</text>
    <text x="408" y="141">a search</text>
  </g>
</svg>
